name: CI

# Pinned versions:
#   pnpm is the workspace's `packageManager` field (pnpm@9.0.0); the action reads it, so it is set in one place.
#   The Node version is `.nvmrc`: CI, releases, Vercel and the engine floor all follow it.
# Neither is repeated here; bump them
# in root `package.json` and `.nvmrc`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so CI minutes are not wasted
# on stale pushes to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test:
    name: Lint, type-check, test, build, pack, smoke, knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Workspace coverage: `pnpm -r <script>` fans out to every
      # workspace that declares the script. turbo would do the same
      # via `pnpm <script>`, but the `pnpm -r` form keeps the step
      # explicit about which workspaces are exercised.
      - name: Lint (biome)
        run: pnpm lint

      - name: Type-check
        run: pnpm -r check-types

      # The MCP and CLI tests drive the built binaries, so the build comes first.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm -r test

      - name: Pack (baka + @baka/mcp-server + @baka/core)
        run: pnpm pack

      # Strict unused file, export, dependency, and unresolved-import gate.
      # Configuration hints are fatal through the root `pnpm knip` script.
      - name: Knip (repository hygiene)
        run: pnpm knip

      - name: Install the @baka/core tarball into a scratch project outside the workspace
        run: node scripts/verify-core-pack.mjs

      # The first run a new user has: install the CLI tarball outside the workspace, run a bundled
      # recipe in an empty project with an empty home and no model.
      - name: Install the baka tarball and run a bundled recipe with no setup
        run: node scripts/verify-cli-pack.mjs

      - name: Smoke test against packed tarballs
        run: |
          set -euo pipefail

          # Install both tarballs into a scratch prefix, as an end user
          # would, and probe the binaries that install puts on the path.
          #
          # The pack step above also produced real tarballs in
          # `dist-tarballs/`; we verify those structurally (right name,
          # contains `package/dist/index.js`).

          echo "=== structural check on packed tarballs ==="
          test -f dist-tarballs/baka-0.1.0.tgz
          test -f dist-tarballs/baka-mcp-server-0.1.0.tgz
          test -f dist-tarballs/baka-core-0.1.0.tgz
          # List first, grep after: `grep -q` quits at the first match, and under
          # `pipefail` the SIGPIPE it sends `tar` fails the pipeline.
          for t in baka-0.1.0 baka-mcp-server-0.1.0 baka-core-0.1.0; do
            tar -tzf "dist-tarballs/${t}.tgz" > "${RUNNER_TEMP}/${t}.list"
            grep -qx 'package/dist/index.js' "${RUNNER_TEMP}/${t}.list"
          done
          grep -qx 'package/dist/index.d.ts' "${RUNNER_TEMP}/baka-core-0.1.0.list"

          echo "=== probe the binaries installed from the tarballs ==="
          prefix="${RUNNER_TEMP}/smoke-prefix"
          rm -rf "$prefix"
          npm install --prefix "$prefix" --no-audit --no-fund --loglevel=error \
            "$PWD/dist-tarballs/baka-0.1.0.tgz" "$PWD/dist-tarballs/baka-mcp-server-0.1.0.tgz"

          CLI_BIN="$prefix/node_modules/.bin/baka"
          MCP_BIN="$prefix/node_modules/.bin/baka-mcp"
          test -x "$CLI_BIN"
          test -x "$MCP_BIN"

          "$CLI_BIN" --version
          "$CLI_BIN" --help >/dev/null

          # Smoke: the `baka-mcp` binary speaks JSON-RPC over stdio.
          INIT_RESP="$(mktemp)"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
            | "$MCP_BIN" \
            > "$INIT_RESP"
          test -s "$INIT_RESP"
          grep -q '"serverInfo"' "$INIT_RESP"
          grep -q '"name":"baka-mcp"' "$INIT_RESP"
          rm -f "$INIT_RESP"

          echo "smoke OK"
