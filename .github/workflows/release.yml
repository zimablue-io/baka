name: Release

# Pushing a tag `vX.Y.Z` builds the five tarballs from that commit, proves the CLI and the core work from
# their tarballs alone, and attaches them to a GitHub release. The tarballs name each other by their release URL, so
# `npm install <url of baka-core.tgz>` resolves @baka/protocol from the same release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Baka is distributed from GitHub releases and the install site; it is not published to npm (docs/PUBLISHING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and attach the tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: The tag is the version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [ "${tag}" != "${GITHUB_REF_NAME}" ]; then echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; fi

      - name: Build and pack
        run: |
          pnpm build
          BAKA_DEP_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" pnpm run pack

      - name: The tarball runs on its own
        run: |
          node scripts/verify-core-pack.mjs
          node scripts/verify-cli-pack.mjs

      - name: Attach the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Unversioned names, so `releases/latest/download/baka-cli.tgz` always means the newest release.
          assets=""
          for name in baka-protocol baka-sdk baka-core baka-cli baka-mcp; do
            cp "dist-tarballs/${name}-${version}.tgz" "dist-tarballs/${name}.tgz"
            assets="$assets dist-tarballs/${name}-${version}.tgz dist-tarballs/${name}.tgz"
          done
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" --title "baka ${version}" --generate-notes $assets \
            install.sh \
            moralo.module.json
